[package]
name = "moran_engine"
version = "0.1.1"
edition = "2024"

[lib]
name = "_engine"
crate-type = ["cdylib"]

[[bin]]
name = "sim-cli"
path = "src/main.rs"

# Off by default so `cargo test` builds the pure-Rust core without Python.
[features]
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
