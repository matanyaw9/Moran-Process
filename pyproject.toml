[project]
name = "moran-graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matanya Wiener", email = "matanya.wiener@weizmann.ac.il" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "moran_graphs._engine"
python-source = "src"
features = ["python"]

# Rebuild the extension on `uv sync` / `uv run` whenever the Rust code changes.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
